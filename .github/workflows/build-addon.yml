name: Build AnkiSync Advanced

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vendor-dependencies:
    name: Vendor dependencies (${{ matrix.os_name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            os_name: windows
          - runner: macos-latest
            os_name: macos
          - runner: ubuntu-latest
            os_name: linux

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Match the Python generation used by current Anki releases, and use
          # the same version on all three runners for consistent dependency resolution.
          python-version: '3.9'

      - name: Install pinned dependencies into platform vendor directory
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --disable-pip-version-check \
            --target "build/vendor/${{ matrix.os_name }}" \
            -r requirements-build.txt

      - name: Smoke-test vendored keyring imports
        shell: bash
        run: |
          python - <<'PY'
          import os
          import sys
          vendor = os.path.abspath("build/vendor/${{ matrix.os_name }}")
          sys.path.insert(0, vendor)
          import keyring
          print("keyring version:", getattr(keyring, "__version__", "unknown"))
          print("keyring module:", keyring.__file__)
          PY

      - name: Upload platform vendor bundle
        uses: actions/upload-artifact@v4
        with:
          name: vendor-${{ matrix.os_name }}
          path: build/vendor/${{ matrix.os_name }}/
          if-no-files-found: error
          retention-days: 7

  package-addon:
    name: Package installable add-on
    runs-on: ubuntu-latest
    needs: vendor-dependencies
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Windows vendor bundle
        uses: actions/download-artifact@v4
        with:
          name: vendor-windows
          path: build/vendor/windows

      - name: Download macOS vendor bundle
        uses: actions/download-artifact@v4
        with:
          name: vendor-macos
          path: build/vendor/macos

      - name: Download Linux vendor bundle
        uses: actions/download-artifact@v4
        with:
          name: vendor-linux
          path: build/vendor/linux

      - name: Assemble installable .ankiaddon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/package/vendor
          cp ankisync_advanced/__init__.py dist/package/__init__.py
          cp ankisync_advanced/config.json dist/package/config.json
          cp -R build/vendor/windows dist/package/vendor/windows
          cp -R build/vendor/macos dist/package/vendor/macos
          cp -R build/vendor/linux dist/package/vendor/linux
          # Put add-on files at ZIP root, as Anki expects for an .ankiaddon file.
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          source = Path("dist/package")
          target = Path("dist/AnkiSync_Advanced.ankiaddon")
          with ZipFile(target, "w", ZIP_DEFLATED) as archive:
              for path in sorted(source.rglob("*")):
                  if path.is_file() and "__pycache__" not in path.parts and path.suffix != ".pyc":
                      archive.write(path, path.relative_to(source).as_posix())
          print(f"Created {target} ({target.stat().st_size:,} bytes)")
          with ZipFile(target) as archive:
              names = archive.namelist()
              assert "__init__.py" in names
              assert "config.json" in names
              for platform in ("windows", "macos", "linux"):
                  assert any(name.startswith(f"vendor/{platform}/keyring/") for name in names), platform
          PY

      - name: Upload installable add-on artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnkiSync_Advanced
          path: dist/AnkiSync_Advanced.ankiaddon
          if-no-files-found: error
          retention-days: 30

      - name: Attach distributable to GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AnkiSync_Advanced.ankiaddon
